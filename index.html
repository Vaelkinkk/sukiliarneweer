<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Permission</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .loading,
    .error,
    .result {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      font-weight: bold;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      margin-top: 18px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .result {
      display: none;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      text-align: left;
    }

    video,
    canvas {
      width: 400px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Memuat...</div>
  </div>

  <div id="error" class="error">
    <div>lu siapa jir🤣🖕</div>
    <div>Berikan izin untuk melanjutkan!</div>

    <button id="retry">
      Coba Lagi
    </button>
  </div>

  <div id="result" class="result">
    <h2>Demo Berhasil</h2>

    <div class="info">
      <div><b>Latitude:</b> <span id="lat">-</span></div>
      <div><b>Longitude:</b> <span id="lon">-</span></div>
      <div><b>Akurasi:</b> <span id="accuracy">-</span> meter</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="400" height="400"></canvas>

    <button id="capture">
      Ambil Foto
    </button>

    <p id="status"></p>
  </div>

  <script>
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");

    const latEl = document.getElementById("lat");
    const lonEl = document.getElementById("lon");
    const accuracyEl = document.getElementById("accuracy");

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const captureBtn = document.getElementById("capture");
    const status = document.getElementById("status");
    const retryBtn = document.getElementById("retry");

    let stream = null;

    function showError() {
      loading.style.display = "none";
      result.style.display = "none";
      errorBox.style.display = "flex";
    }

    function showResult() {
      loading.style.display = "none";
      errorBox.style.display = "none";
      result.style.display = "flex";
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation tidak tersedia."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          position => {
            resolve(position.coords);
          },
          error => {
            reject(error);
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      });
    }

    async function requestCamera() {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error("Kamera tidak tersedia.");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "user"
          },
          width: {
            ideal: 400
          },
          height: {
            ideal: 400
          }
        },
        audio: false
      });

      video.srcObject = stream;
    }

    async function start() {
      loading.style.display = "flex";
      errorBox.style.display = "none";
      result.style.display = "none";

      try {
        // 1. Minta lokasi
        const coords = await getLocation();

        latEl.textContent = coords.latitude;
        lonEl.textContent = coords.longitude;
        accuracyEl.textContent = Math.round(coords.accuracy);

        // 2. Setelah lokasi berhasil, minta kamera depan
        await requestCamera();

        // 3. Tampilkan hasil
        showResult();

      } catch (err) {
        console.error(err);

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        showError();
      }
    }

    captureBtn.addEventListener("click", () => {
      const ctx = canvas.getContext("2d");

      const size = Math.min(
        video.videoWidth,
        video.videoHeight
      );

      const sx = (video.videoWidth - size) / 2;
      const sy = (video.videoHeight - size) / 2;

      canvas.width = 400;
      canvas.height = 400;

      ctx.drawImage(
        video,
        sx,
        sy,
        size,
        size,
        0,
        0,
        400,
        400
      );

      canvas.style.display = "block";

      status.textContent =
        "Foto berhasil diambil. Data hanya ditampilkan di halaman ini.";

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    });

    retryBtn.addEventListener("click", () => {
      start();
    });

    // Mulai otomatis saat halaman dibuka
    start();
  </script>

</body>
</html>
